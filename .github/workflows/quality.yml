name: Quality gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run isolated backend regression
        working-directory: backend
        run: python scripts/run_local_tests.py
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --no-deps --disable-pip -r backend/requirements.txt

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: bankguard_ci
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: bankguard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bankguard_ci -d bankguard_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      CI_POSTGRES_TEST: '1'
      JWT_SECRET: local-ci-jwt-test-key-32-characters-only
      DATABASE_URL: postgresql+psycopg://bankguard_ci:local_ci_only@127.0.0.1:5432/bankguard_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Migrate and test disposable PostgreSQL only
        working-directory: backend
        run: python scripts/run_ci_postgres.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Create disposable browser fixture
        working-directory: backend
        run: |
          export CI_BROWSER_AUTH_FILE="$RUNNER_TEMP/bankguard-browser-auth.json"
          printf 'CI_BROWSER_AUTH_FILE=%s\n' "$CI_BROWSER_AUTH_FILE" >> "$GITHUB_ENV"
          python scripts/ci_browser_fixture.py create
      - name: Start local test services
        run: |
          cd backend
          FRONTEND_ORIGIN=http://127.0.0.1:3144 nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8144 > "$RUNNER_TEMP/bankguard-api.log" 2>&1 &
          cd ../frontend
          BANKGUARD_API_URL=http://127.0.0.1:8144 nohup npm run dev -- --hostname 127.0.0.1 --port 3144 > "$RUNNER_TEMP/bankguard-web.log" 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --max-time 5 -fsS http://127.0.0.1:8144/health/database > /dev/null && curl --max-time 5 -fsS http://127.0.0.1:3144/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo 'Local test services did not become healthy' >&2
          exit 1
      - name: Run real local browser smoke at desktop and 390px
        working-directory: frontend
        run: npm run test:e2e
      - name: Remove disposable browser fixture
        if: always()
        working-directory: backend
        run: python scripts/ci_browser_fixture.py cleanup

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run all frontend tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
